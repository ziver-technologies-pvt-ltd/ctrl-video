name: ctrl_video
description: "A cross-platform desktop video downloader powered by yt-dlp and ffmpeg."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.14.0

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.6.1

  # Local Persistence
  drift: ^2.28.1
  sqlite3_flutter_libs: ^0.5.28
  path: ^1.9.1

  # Desktop OS Integrations
  path_provider: ^2.1.5
  file_picker: ^8.1.7
  open_filex: ^4.5.0
  url_launcher: ^6.3.1

  # Logging & Utilities
  logger: ^2.5.0
  crypto: ^3.0.6
  http: ^1.3.0
  intl: ^0.20.2

  # Media Player Engine (libmpv)
  media_kit: ^1.1.11
  media_kit_video: ^1.2.5
  media_kit_libs_video: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.28.1
  build_runner: ^2.4.15

flutter:
  uses-material-design: true

  assets:
    - lib/assets/
    - assets/branding/
    - assets/engine/
